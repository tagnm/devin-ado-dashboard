services:
  dashboard:
    build:
      context: .
      target: development
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - dashboard_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build:
      context: .
      target: development
    command: node --watch server/index.js
    environment:
      PORT: 3001
    env_file:
      - .env
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules

volumes:
  dashboard_node_modules:
  backend_node_modules:
